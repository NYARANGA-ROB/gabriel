<header class="dashboard-topbar">
    <div class="topbar-left">
        <button class="btn btn-link topbar-toggle" id="sidebarToggle" type="button"
                aria-label="Toggle sidebar" aria-controls="dashboardSidebar" aria-expanded="false">
            <i class="bi bi-list fs-4"></i>
        </button>
        <div class="topbar-heading">
            <h1 class="topbar-title">{% block page_title %}Dashboard{% endblock %}</h1>
            <p class="topbar-subtitle mb-0">{% block page_subtitle %}30-day readmission risk framework{% endblock %}</p>
        </div>
    </div>

    <div class="topbar-right">
        <div class="dropdown">
            <button class="btn btn-light topbar-user-btn dropdown-toggle d-flex align-items-center gap-2"
                    type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="topbar-user-avatar">
                    {{ current_user.first_name[0] }}{{ current_user.last_name[0] }}
                </span>
                <span class="d-none d-md-inline">{{ current_user.first_name }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li>
                    <span class="dropdown-item-text text-muted small">{{ current_user.email }}</span>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('auth.profile') }}">
                        <i class="bi bi-person me-2"></i>Profile
                    </a>
                </li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('auth.logout') }}">
                        <i class="bi bi-box-arrow-right me-2"></i>Sign out
                    </a>
                </li>
            </ul>
        </div>
    </div>
</header>
