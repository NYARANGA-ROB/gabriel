{% extends "base.html" %}

{% block title %}Server Error | {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">500</div>
        <h1 class="h4 fw-bold mb-2">Something went wrong</h1>
        <p class="text-muted mb-4">An unexpected error occurred. Please try again later.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">
            <i class="bi bi-house-door me-2"></i>Return home
        </a>
    </div>
</div>
{% endblock %}
