{% extends "base.html" %}

{% block title %}Page Not Found | {{ config.APP_NAME }}{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-code">404</div>
        <h1 class="h4 fw-bold mb-2">Page not found</h1>
        <p class="text-muted mb-4">The page you requested could not be found.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">
            <i class="bi bi-house-door me-2"></i>Return home
        </a>
    </div>
</div>
{% endblock %}
